name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows_installer:
        description: Build the unsigned local Windows installer
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev --locked
      - run: uv run ruff check backend
      - run: uv run mypy backend/src
      - run: uv run pytest
      - run: uv run python scripts/secret_scan.py
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  windows-source-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra dev --locked
      - run: >-
          uv run pytest
          backend/tests/test_instance.py
          backend/tests/test_tls_and_runner.py
          backend/tests/test_wsl.py
          backend/tests/test_windows_integration.py
          backend/tests/test_hidden_windows.py
          backend/tests/test_windowed_start.py
          backend/tests/test_certificate_follows_address.py
          backend/tests/test_academy_stop.py
          backend/tests/test_wsl_wake_and_host_key.py
          backend/tests/test_timezone_data.py
          backend/tests/test_relay_restored_for_active_lab.py
          -rA -s
      - name: Parse real Windows integration test
        shell: powershell
        run: |
          $Source = Get-Content -LiteralPath scripts\windows-integration-test.ps1 -Raw
          [void][scriptblock]::Create($Source)
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build and smoke frozen executables
        shell: powershell
        run: |
          uv run pyinstaller --noconfirm --clean installer\windows\CyberRangeCoach.spec
          $Application = Resolve-Path "dist\CyberRangeCoach\CyberRangeCoach.exe"
          $Doctor = Resolve-Path "dist\CyberRangeCoach\CyberRangeCoachDoctor.exe"
          & $Application --help
          if ($LASTEXITCODE -ne 0) { throw "Application frozen smoke failed with $LASTEXITCODE" }
          & $Doctor --help
          if ($LASTEXITCODE -ne 0) { throw "Doctor frozen smoke failed with $LASTEXITCODE" }
          # Browser time zones must resolve in the frozen build (25.09.2026: 422 on Windows).
          $Zone = Get-ChildItem -Path "dist\CyberRangeCoach" -Recurse -Filter "Almaty" | Where-Object { $_.FullName -match "tzdata\\zoneinfo\\Asia\\Almaty$" }
          if (-not $Zone) { throw "tzdata zoneinfo/Asia/Almaty is missing in the frozen build" }

  windows-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: choco install innosetup 7zip --yes --no-progress
      - run: uv sync --extra dev --locked
      - run: npm ci
        working-directory: frontend
      - name: Build installer with pinned local OCR
        shell: powershell
        run: .\scripts\package-windows.ps1 -PrepareOcr
      - name: Smoke install and canonical executable
        shell: pwsh
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP "CyberRangeCoach-Smoke"
          $Installer = Resolve-Path "dist\installer\CyberRangeCoach-Setup.exe"
          $Install = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=$InstallDir" -Wait -PassThru
          if ($Install.ExitCode -ne 0) { throw "Installer exited with $($Install.ExitCode)" }
          $Application = Join-Path $InstallDir "CyberRangeCoach.exe"
          if (-not (Test-Path -LiteralPath $Application -PathType Leaf)) { throw "Installed executable is missing" }
          $Cli = Start-Process -FilePath $Application -ArgumentList "--help" -Wait -PassThru
          if ($Cli.ExitCode -ne 0) { throw "Installed CLI smoke exited with $($Cli.ExitCode)" }
          # Start the academy exactly like the Start menu shortcut ("serve --lan",
          # windowed exe without console) and require a real HTTPS answer: a crash
          # dialog keeps the process alive, so "still running" proves nothing.
          $env:CRC_DATA_DIR = Join-Path $env:RUNNER_TEMP "CyberRangeCoach-Data"
          $Setup = Start-Process -FilePath $Application -ArgumentList "setup", "--generate-certificate" -Wait -PassThru
          if ($Setup.ExitCode -ne 0) { throw "Certificate setup exited with $($Setup.ExitCode)" }
          $Academy = Start-Process -FilePath $Application -ArgumentList "serve", "--lan", "--no-browser" -PassThru
          $answered = $false
          for ($i = 0; $i -lt 90 -and -not $answered; $i++) {
            Start-Sleep -Seconds 1
            if ($Academy.HasExited) { throw "Academy exited during start with $($Academy.ExitCode)" }
            try {
              $response = Invoke-WebRequest -Uri "https://127.0.0.1:8443/api/v2/devices/me" -SkipCertificateCheck -TimeoutSec 3
              $answered = $response.StatusCode -lt 500
            } catch { if ($_.Exception.Response) { $answered = [int]$_.Exception.Response.StatusCode -lt 500 } }
          }
          if (-not $answered) {
            Stop-Process -Id $Academy.Id -Force -ErrorAction SilentlyContinue
            throw "Academy did not answer on https://127.0.0.1:8443 within 90 s"
          }
          # Upgrade over the running academy (owner's laptop 25.09.2026: Restart
          # Manager could not close it and the install rolled back).
          # An open lab page keeps a connection busy (26.09.2026: uvicorn waited
          # for it forever); an unfinished request stands in for it.
          $Hanging = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 8443)
          $AcceptAny = [System.Net.Security.RemoteCertificateValidationCallback] { $true }
          $HangingTls = New-Object System.Net.Security.SslStream($Hanging.GetStream(), $false, $AcceptAny)
          $HangingTls.AuthenticateAsClient("127.0.0.1")
          $Partial = [System.Text.Encoding]::ASCII.GetBytes("POST /api/v2/devices/pairing-codes HTTP/1.1`r`nHost: 127.0.0.1`r`nContent-Type: application/json`r`nContent-Length: 1000`r`n`r`n{")
          $HangingTls.Write($Partial, 0, $Partial.Length)
          $HangingTls.Flush()
          $UpgradeLog = Join-Path $env:RUNNER_TEMP "upgrade.log"
          $Upgrade = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=$InstallDir", "/LOG=$UpgradeLog" -Wait -PassThru
          $Hanging.Close()
          $AcademyStopped = $Academy.WaitForExit(30000)
          Stop-Process -Id $Academy.Id -Force -ErrorAction SilentlyContinue
          if ($Upgrade.ExitCode -ne 0) { throw "Upgrade over the running academy exited with $($Upgrade.ExitCode)" }
          if (-not $AcademyStopped) { throw "Installer did not stop the running academy" }
          if (Select-String -LiteralPath $UpgradeLog -SimpleMatch "закрываем принудительно" -Quiet) { throw "Academy ignored the stop request and was killed" }
          if (-not (Select-String -LiteralPath (Join-Path $env:CRC_DATA_DIR "logs\academy.log") -SimpleMatch "Получен запрос остановки" -Quiet)) { throw "Academy was not stopped through the stop request" }
          $Log = Join-Path $env:CRC_DATA_DIR "logs\academy.log"
          if (-not (Test-Path -LiteralPath $Log) -or (Get-Item -LiteralPath $Log).Length -eq 0) { throw "academy.log is missing or empty" }
          Remove-Item Env:CRC_DATA_DIR
          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          $Uninstall = Start-Process -FilePath $Uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($Uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($Uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: CyberRangeCoach-Windows-unsigned
          path: |
            dist/installer/CyberRangeCoach-Setup.exe
            dist/installer/CyberRangeCoach-Setup.exe.sha256
