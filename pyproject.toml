[project]
name = "cyber-range-coach"
version = "2.0.0a2"
description = "Windows-centred interactive cybersecurity academy for an authorised local range"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncssh>=2.21,<3",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11.3,<13",
  "platformdirs>=4.3,<5",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
cyber-range-coach = "cyber_range_coach.cli:main"
cyber-range-coach-doctor = "cyber_range_coach.doctor:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cyber_range_coach"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
# FastAPI dependencies are intentionally created in defaults. Cyrillic copy and the
# reviewed Private-LAN binds are expected. Ruff formatter owns physical line layout.
ignore = ["ASYNC109", "B008", "E501", "RUF001", "S101", "S104", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cyber_range_coach"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncssh.*", "docx.*"]
ignore_missing_imports = true
