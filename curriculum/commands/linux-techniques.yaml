challenges:
- id: linux-pwd-current-directory-recall
  technique_id: linux-pwd-current-directory
  prompt: Показать текущий каталог. Напишите команду для синтетического учебного примера.
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: 'Показать текущий каталог. Образ: компас отвечает, где вы.'
  - level: 2
    label: Название команды
    text: Начните с команды pwd.
  - level: 3
    label: Скелет
    text: pwd <аргументы> <аргументы>
  - level: 4
    label: Полный пример
    text: pwd. Сверьте инструмент, значимые флаги и аргументы по задаче.
  recall:
    shell: bash
    expected_tool: pwd
    accepted_answers:
    - pwd
    significant_flags: *id001
    permutable_answers: []
    other_shell_tools:
    - Get-ChildItem
    - Get-Content
    - Select-String
    - findstr
    - where.exe
    - cmd.exe
    - powershell
  observation:
    prompt: 'Что в результате нужно увидеть, чтобы подтвердить задачу: показать текущий каталог.?'
    expected_concepts:
    - - путь
      - каталог
    sample_answer: Результат содержит ожидаемый признак и не доказывает ничего за пределами этого вывода.
  version: 1
