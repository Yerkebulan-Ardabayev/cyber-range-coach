challenges:
- id: linux-pwd-current-directory-recall
  technique_id: linux-pwd-current-directory
  prompt: Вы открыли терминал и не знаете, в каком каталоге находитесь. Выведите полный путь к текущему
    каталогу.
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: 'Показать текущий каталог. Образ: компас отвечает, где вы.'
  - level: 2
    label: Название команды
    text: Начните с команды pwd.
  - level: 3
    label: Скелет
    text: pwd <аргументы> <аргументы>
  - level: 4
    label: Полный пример
    text: pwd. Сверьте инструмент, значимые флаги и аргументы по задаче.
  recall:
    shell: bash
    expected_tool: pwd
    accepted_answers:
    - pwd
    significant_flags: *id001
    permutable_answers: []
    other_shell_tools:
    - Get-ChildItem
    - Get-Content
    - Select-String
    - findstr
    - where.exe
    - cmd.exe
    - powershell
    comparison_mode: exact
  observation:
    prompt: Какой полный путь показала команда?
    sample_answer: Вывод показывает, что оболочка стоит в /home/student/training. Он не показывает, какие
      файлы лежат в этом каталоге.
    example_output: 'student@training-vm:~/training$ pwd

      /home/student/training'
    output_source: reference_linux
    fields:
    - id: current_path
      label: Какой путь вернула команда?
      accepted_values:
      - /home/student/training
      - /home/student/training/
      accepted_patterns: []
  version: 2
  context:
    shell: bash
    working_directory: /home/student/training
    named_inputs:
      task: Узнать полный путь к текущему каталогу.
    constraints:
    - Используйте только именованные синтетические исходные данные условия.
    - Ответ вводится как текст и не исполняется приложением Coach.
  answer_fields:
  - id: command
    label: Команда в Bash
    kind: command
- id: linux-ls-directory-listing-recall
  technique_id: linux-ls-directory-listing
