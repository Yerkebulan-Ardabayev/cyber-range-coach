challenges:
- id: win-systeminfo-full-configuration-recall
  technique_id: win-systeminfo-full-configuration
  prompt: 'Нужна полная конфигурация машины одним выводом: версия системы, память, сетевые адаптеры. Какой
    источник вы спрашиваете?'
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: Из пяти свидетелей нужен самый многословный, тот, что рассказывает про всё сразу.
  - level: 2
    label: Название команды
    text: Команда состоит из одного слова и не требует ни одного ключа.
  - level: 3
    label: Скелет
    text: <команда без ключей>
  - level: 4
    label: Полный пример
    text: systeminfo. Дальше поле выбирают фильтром, а не глазами.
  recall:
    shell: cmd
    expected_tool: systeminfo
    accepted_answers:
    - systeminfo
    significant_flags: *id001
    permutable_answers: []
    other_shell_tools: &id003
    - ls
    - cat
    - grep
    - pwd
    - chmod
    - chown
    - sudo
    - ps
    - kill
    - awk
    - sed
    - touch
    - rm
    - mv
    - cp
    - ln
    - less
    - head
    - tail
    - wc
    - stat
    - uname
    - id
    - su
    - Get-ChildItem
    - Get-Content
    comparison_mode: exact
  observation:
    prompt: Что доказывает этот вывод и чем в нём OS Name отличается от OS Version?
    sample_answer: Вывод даёт весь протокол о машине. OS Name это название продукта, OS Version это номер
      сборки. Это соседние строки одного источника, и они отвечают на разные вопросы, поэтому подставлять
      одно вместо другого нельзя.
    example_output: Пример вывода появится после снимка со стенда.
    fields: []
    output_source: pending
  version: 2
  context:
    shell: cmd
    working_directory: C:\Training
    named_inputs:
      task_goal: 'Показать полную конфигурацию машины: версию системы, память и сетевые адаптеры одним
        выводом.'
    constraints:
    - Используйте только именованные синтетические исходные данные условия.
    - Ответ вводится как текст и не исполняется приложением Coach.
  answer_fields:
  - id: command
    label: Команда в cmd.exe
    kind: command
- id: win-systeminfo-field-line-start-recall
  technique_id: win-systeminfo-field-line-start
  prompt: Из полного протокола нужно поле OS Name и только оно. Соседняя строка OS Version начинается
    так же. Как отфильтровать?
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: Источник уже назван, осталось взять точное поле. Фильтр ставят через конвейер.
  - level: 2
    label: Название команды
    text: Фильтр по содержимому в cmd.exe это findstr, а не find.
  - level: 3
    label: Скелет
    text: systeminfo | findstr <ключ начала> <ключ образца>"<поле>"
  - level: 4
    label: Полный пример
    text: 'systeminfo | findstr /b /c:"OS Name". Ключ /b требует совпадения в начале строки, /c: делает
      текст в кавычках одним образцом.'
  recall:
    shell: cmd
    expected_tool: systeminfo
    accepted_answers:
    - systeminfo | findstr /b /c:"OS Name"
    significant_flags: *id002
    permutable_answers: []
    other_shell_tools: *id003
    comparison_mode: exact
  observation:
    prompt: Почему без /b в вывод попадёт лишняя строка, и что случится без /c:?
    sample_answer: 'Без /b совпадение ищется в любом месте строки, поэтому вместе с OS Name придёт и OS
      Version. Без /c: пробел разбивает фразу на два независимых образца, и findstr начинает искать слово
      OS отдельно от слова Name.'
    example_output: Пример вывода появится после снимка со стенда.
    fields: []
    output_source: pending
  version: 2
  context:
    shell: cmd
    working_directory: C:\Training
    named_inputs:
      target_path: /c:"OS
      argument: Name
    constraints:
    - Используйте только именованные синтетические исходные данные условия.
    - Ответ вводится как текст и не исполняется приложением Coach.
  answer_fields:
  - id: command
    label: Команда в cmd.exe
    kind: command
- id: win-systeminfo-hotfix-lines-recall
  technique_id: win-systeminfo-hotfix-lines
  prompt: Нужен список установленных исправлений из полного протокола системы. Каждое из них помечено
    в выводе одинаково.
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: Источник тот же многословный свидетель, фильтр берёт строки по признаку.
  - level: 2
    label: Название команды
    text: Фильтровать будет findstr, признак исправления это две буквы.
  - level: 3
    label: Скелет
    text: systeminfo | findstr <ключ образца>"<признак>"
  - level: 4
    label: Полный пример
    text: 'systeminfo | findstr /c:"KB". Ключ /b здесь не нужен: строки исправлений начинаются не с признака.'
  recall:
    shell: cmd
    expected_tool: systeminfo
    accepted_answers:
    - systeminfo | findstr /c:"KB"
    significant_flags: *id004
    permutable_answers: []
    other_shell_tools: *id003
    comparison_mode: exact
  observation:
    prompt: 'Что именно вы получили в ответ: список или число, и что из этого просят чаще?'
    sample_answer: На экране список строк, по одной на исправление. Если задание просит количество, эти
      строки надо ещё посчитать отдельным звеном конвейера, а не пересчитывать глазами.
    example_output: Пример вывода появится после снимка со стенда.
    fields: []
    output_source: pending
  version: 2
  context:
    shell: cmd
    working_directory: C:\Training
    named_inputs:
      target_path: /c:"KB
    constraints:
    - Используйте только именованные синтетические исходные данные условия.
    - Ответ вводится как текст и не исполняется приложением Coach.
  answer_fields:
  - id: command
    label: Команда в cmd.exe
    kind: command
- id: win-reg-query-product-name-recall
  technique_id: win-reg-query-product-name
  prompt: Название продукта нужно взять не из протокола, а из ветки CurrentVersion в реестре. В пути есть
    пробел.
  estimated_minutes: 5
  hints:
  - level: 1
    label: Смысл и образ
    text: 'Это архивариус: он читает запись из книги, а не пересказывает своими словами.'
  - level: 2
    label: Название команды
    text: Команда чтения реестра это reg query, конкретное значение выбирает ключ /v.
  - level: 3
    label: Скелет
    text: reg query "<путь с пробелом>" <ключ значения> <имя>
  - level: 4
    label: Полный пример
    text: reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion" /v ProductName. Кавычки обязательны
      из-за пробела в Windows NT.
  recall:
    shell: cmd
    expected_tool: reg
    accepted_answers:
    - reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion" /v ProductName
    significant_flags: *id005
    permutable_answers: []
    other_shell_tools: *id003
    comparison_mode: exact
  observation:
    prompt: Три графы значения это имя, тип и данные. Какая из них отвечает на вопрос и почему ProductName
      может не совпасть с OS Name?
    sample_answer: 'Отвечает графа данных, третья в строке. ProductName и OS Name это разные поля разных
      источников: они описывают одну систему по-своему, и требовать дословного совпадения нельзя.'
    example_output: Пример вывода появится после снимка со стенда.
    fields: []
    output_source: pending
  version: 2
  context:
    shell: cmd
    working_directory: C:\Training
    named_inputs:
      argument: query
      target_path: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion
      argument_2: ProductName
    constraints:
    - Используйте только именованные синтетические исходные данные условия.
    - Ответ вводится как текст и не исполняется приложением Coach.
  answer_fields:
  - id: command
    label: Команда в cmd.exe
    kind: command
