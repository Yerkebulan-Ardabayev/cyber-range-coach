- id: win-systeminfo-full-configuration
  family: systeminfo
  shell: cmd
  execution_status: awaiting_stand
  purpose: 'Показать полную конфигурацию машины: версию системы, память и сетевые адаптеры одним выводом.'
  significant_flags: &id001 []
  typical_error: 'Взять соседнее поле того же вывода: OS Version вместо OS Name.'
  mnemonic_image: многословный свидетель рассказывает сразу всё
  source_refs:
  - source: 01 · Инвентаризация операционной системы · мнемоника.docx
    address: P025
  version: 1
- id: win-systeminfo-field-line-start
