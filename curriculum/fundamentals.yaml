    simple_theory:
      analogy: В школе есть директор. У него ключи от всех дверей и номер один в списке.
      what_it_does:
      - Та же команда покажет сведения о другом человеке.
      - Имя пишется после команды.
      - У главного пользователя номер всегда ноль.
      words: []
      picture: "сведения о root\nuid=0(root) gid=0(root) groups=0(root)\n    ^ номер ноль = главный\n"
      check_question: Какой номер у главного пользователя в любой такой системе?
