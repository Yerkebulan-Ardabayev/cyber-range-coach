    skill_id: linux-search
    stage: independent
    target_tags: []
    requires_target: false
    term:
      name: область поиска
      definition: Каталог, внутри которого find разрешено обходить дерево.
    worked_example: "`find /etc -maxdepth 1 -name 'hosts'` ограничивает обход одним уровнем."
    prediction_question: Почему `-maxdepth 1` делает результат и нагрузку предсказуемее?
    command: "find /etc -maxdepth 1 -name 'hosts' -print"
