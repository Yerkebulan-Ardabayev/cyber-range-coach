track:
  id: fundamentals-to-pentesting
  title: Основы, которые выдерживают практику
  summary: От факта и Linux до HTTP, границ доступа и доказательного отчёта.
  role: foundation
  version: 1

lessons:
  - id: scope-fact-hypothesis
    order: 10
    title: Факт, гипотеза и разрешённая область
    summary: Учимся не выдавать предположение за наблюдение и держать работу внутри своего стенда.
    estimated_minutes: 15
    skill_id: evidence-reasoning
    stage: introduced
    target_tags: []
    requires_target: false
    term:
      name: разрешённая область
      definition: Заранее зафиксированные цель, допустимые действия, время работы и условие остановки. Всё вне этих границ запрещено до нового разрешения владельца.
    simple_theory:
      analogy: Это как игра в прятки во дворе. Заранее договорились искать только во дворе и только десять
        минут. В чужой подъезд заходить нельзя.
      what_it_does:
      - Перед работой записываем правила. Где можно, что можно, сколько времени и когда остановиться.
      - Факт это то, что ты сам увидел на экране.
      - Догадка это то, что ты пока только думаешь. Её ещё надо проверить.
      words:
      - term: SCOPE
        meaning: Граница работы. Что и где разрешено делать.
      - term: FACT
        meaning: Факт. То, что ты увидел своими глазами.
      - term: HYPOTHESIS
        meaning: Догадка. Её нужно проверить, прежде чем верить.
      - term: pwd
        meaning: Команда. Говорит, в какой папке ты сейчас.
      - term: printf
        meaning: Команда. Печатает на экран заданный текст.
      picture: 'ПРАВИЛА (SCOPE)
    
        +--------------------------------+
    
        | где:      127.0.0.1:8080       |
    
        | что:      только смотреть      |
    
        | сколько:  15 минут             |
    
        | стоп:     любой другой адрес   |
    
        +--------------------------------+
    
        FACT        = увидел сам         [v]
    
        HYPOTHESIS  = думаю, проверю     [?]
    
        '
      check_question: Ты увидел на экране путь `/home/student`. Это факт или догадка?
      check_answer: Факт. Ты увидел его своими глазами на экране.
    worked_example: В домашнем стенде разрешена только цель `127.0.0.1:8080`, только TCP/HTTP-проверки, 15 минут. Работа останавливается, если команда уходит на другой адрес. Путь, который вернул `pwd`, будет фактом о текущем каталоге, а предположение о web-приложении на цели останется гипотезой до сетевой проверки.
    prediction_question: Какие четыре границы разрешения и какие два типа утверждений появятся в выводе?
    command: "current_dir=\"$(pwd)\" && printf 'SCOPE TARGET: 127.0.0.1:8080\\nSCOPE ACTIONS: TCP and HTTP read-only checks\\nSCOPE WINDOW: 15 minutes\\nSCOPE STOP: any other address\\nFACT: current directory %s\\nHYPOTHESIS: target may be a web application\\n' \"$current_dir\""
    command_explanation:
      - "pwd наблюдает текущий каталог, а printf оформляет результат вместе с границами работы."
      - "SCOPE фиксирует цель, действия, время и условие остановки."
      - "FACT содержит путь, реально возвращённый pwd."
      - "HYPOTHESIS обозначает вывод, который ещё надо проверить."
    grader:
      source: transcript
      required_patterns: ["SCOPE TARGET:.*127\\.0\\.0\\.1:8080", "SCOPE ACTIONS:.*read-only", "SCOPE WINDOW:.*15 minutes", "SCOPE STOP:.*other address", "FACT: current directory /[^\\r\\n]*", "HYPOTHESIS:.*web application"]
      forbidden_patterns: ["command not found"]
      fact_template: Вы зафиксировали цель, действия, время и условие остановки, подтвердили текущий каталог командой pwd и отделили этот факт от гипотезы о приложении.
    explanation_prompt: Назовите четыре границы разрешения. Почему наблюдение текущего каталога ничего не доказывает о сервисе на учебной цели?
    review_question: Назовите цель, допустимые действия, время, условие остановки, один факт и одну гипотезу последней лаборатории.

  - id: linux-navigation-pwd
    order: 20
    title: Где я нахожусь в Linux
    summary: Связываем текущий каталог, абсолютный путь и безопасную ориентацию перед действием.
    estimated_minutes: 15
    skill_id: linux-navigation
    stage: guided
    target_tags: []
    requires_target: false
    term:
      name: абсолютный путь
      definition: Полный адрес файла или каталога, начинающийся от корня `/`.
    simple_theory:
      analogy: Представь большой дом с комнатами. Команда `pwd` отвечает на вопрос, в какой комнате я сейчас
        стою.
      what_it_does:
      - Компьютер хранит файлы в папках, как вещи в комнатах.
      - Команда `pwd` печатает полный адрес твоей папки.
      - Адрес всегда начинается с косой черты. Это вход в дом.
      words:
      - term: pwd
        meaning: Сокращение английских слов «покажи рабочую папку».
      picture: "/                    <- вход в дом\n+-- home             <- коридор\n    +-- student     \
        \ <- твоя комната\n        +-- training <- ты здесь\n\n$ pwd\n/home/student/training\n"
      check_question: С какого знака всегда начинается ответ команды `pwd`?
      check_answer: С косой черты `/`. Это самое начало всех папок.
    worked_example: Перед чтением или поиском `pwd` фиксирует текущую точку и не даёт ошибиться каталогом.
    prediction_question: С какого символа начнётся вывод `pwd` и почему?
    command: pwd
    command_explanation:
      - "pwd означает print working directory."
      - "Команда ничего не изменяет."
      - "Вывод должен быть одним абсолютным путём."
    grader:
      source: transcript
      required_patterns: ["(?:^|\\n)/[^\\r\\n]*"]
      forbidden_patterns: ["pwd:.*error", "command not found"]
      fact_template: Терминал вернул абсолютный путь текущего каталога.
    explanation_prompt: Что именно доказал вывод `pwd`, а что он не говорит о содержимом каталога?
    review_question: Какая команда фиксирует текущий каталог без изменения состояния?

  - id: linux-navigation-home
    order: 21
    title: 'Сам: вернись домой и докажи адрес'
    summary: Ты где-то в системе. Перейди в свою домашнюю папку и одной строкой покажи её полный адрес.
    estimated_minutes: 10
    skill_id: linux-navigation
    stage: independent
    ladder_step: 2
    target_tags: []
    requires_target: false
    term:
      name: домашний каталог
      definition: Личная папка пользователя, обычно `/home/<имя>`. Знак `~` в команде заменяет её адрес.
    simple_theory:
      analogy: Дом, где твоя комната, всегда можно найти по короткому слову «домой». В терминале это знак `~`.
      what_it_does:
      - Знак `~` означает твою домашнюю папку.
      - Сначала переходишь, потом проверяешь адрес.
      - Две команды можно связать знаком `&&`. Вторая выполнится, только если первая прошла.
      words: []
      picture: "где угодно  --(перейти в ~)-->  /home/student\n                                проверить адрес\n \
        \                               /home/student   <- ответ\n"
      check_question: Что значит знак `~` в команде?
      check_answer: Твою домашнюю папку, например `/home/student`.
    worked_example: Любая работа начинается с понимания, где ты. Домашняя папка это место, куда можно вернуться из
      любого каталога.
    prediction_question: С какого слова начнётся адрес домашней папки после проверки?
    command: cd ~ && pwd
    command_patterns:
    - '(?:^|\s)cd(?: (?:~/?|\$HOME/?|/home/[^\s/]+/?))?(?= (?:;|&&)|\n|$)[\s\S]*(?:^|\s)pwd(?:\s|$)'
    command_tools: [cd, pwd]
    accepted_commands:
    - cd && pwd
    - cd $HOME && pwd
    - cd ~/ && pwd
    command_explanation:
    - cd ~ переводит в домашнюю папку.
    - '&& запускает pwd, только если переход удался.'
    - pwd печатает полный адрес.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)/home/[^/\s]+\s*(?:\r?\n|$)
      forbidden_patterns:
      - No such file
      - command not found
      fact_template: Терминал показал адрес домашней папки после перехода.
    explanation_prompt: Почему после перехода полезно сразу проверить адрес?
    review_question: Какой знак заменяет адрес домашней папки?

  - id: linux-navigation-logs
    order: 22
    title: 'Перенос: встань туда, где лежат журналы'
    summary: Журналы системы живут в папке log внутри var от корня. Перейди туда и докажи, что ты на месте.
    estimated_minutes: 10
    skill_id: linux-navigation
    stage: transfer
    ladder_step: 3
    target_tags: []
    requires_target: false
    term:
      name: журнал
      definition: Файл, куда программы записывают, что с ними происходило. В Linux журналы лежат в `/var/log`.
    simple_theory:
      analogy: У школы есть архив с дневниками дежурных. Чтобы их читать, сначала надо прийти в архив.
      what_it_does:
      - Журналы программ хранятся в одной общей папке.
      - Путь от корня начинается с косой черты.
      - Без косой черты в начале поиск пойдёт от текущей папки.
      words: []
      picture: "/                 <- корень\n+-- var\n    +-- log       <- журналы, цель\n"
      check_question: Ты в `/home/student` и пишешь путь `var/log` без косой черты. Куда ты попадёшь?
      check_answer: Никуда. Будет искаться `/home/student/var/log`, а такой папки нет.
    worked_example: Разбор инцидента почти всегда начинается с журналов. Сначала надо уверенно встать в их папку.
    prediction_question: Какой адрес покажет проверка, если переход удался?
    command: cd /var/log && pwd
    command_patterns:
    - '(?:^|\s)cd /var/log/?(?= (?:;|&&)|\n|$)[\s\S]*(?:^|\s)pwd(?:\s|$)'
    command_tools: [cd, pwd]
    accepted_commands:
    - cd /var/log/ && pwd
    command_explanation:
    - Путь начинается с / и поэтому идёт от корня.
    - pwd подтверждает, что ты в папке журналов.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)/var/log\s*(?:\r?\n|$)
      forbidden_patterns:
      - No such file
      - command not found
      fact_template: Терминал подтвердил переход в папку журналов `/var/log`.
    explanation_prompt: Что изменилось бы, если бы путь был написан без первой косой черты?
    review_question: Где в Linux лежат журналы системы?

  - id: linux-files-listing
    order: 30
    title: Читать структуру файлов, а не угадывать
    summary: Разбираем тип, владельца, permissions, размер и имя в длинном листинге.
    estimated_minutes: 20
    skill_id: linux-files
    stage: guided
    target_tags: []
    requires_target: false
    term:
      name: metadata файла
      definition: Свойства объекта, например тип, permissions, владелец, группа, размер и время изменения.
    simple_theory:
      analogy: Команда `ls -la` похожа на опись вещей в комнате. На каждой вещи бирка. На ней написано, чья
        вещь, кому можно её трогать и сколько она весит.
      what_it_does:
      - Команда `ls` показывает, что лежит в папке.
      - Буква `l` добавляет к каждой вещи подробную бирку.
      - Буква `a` показывает и спрятанные вещи. Их имена начинаются с точки.
      words:
      - term: ls
        meaning: Сокращение английского слова «список».
      picture: '$ ls -la
    
        drwxr-xr-x  student  4096  .          <- эта папка
    
        drwxr-xr-x  root     4096  ..         <- папка выше
    
        -rw-r--r--  student   220  .bashrc    <- спрятанный файл
    
        -rw-r--r--  student    31  notes.txt
    
    
        d = папка      - = файл
    
        r = читать     w = писать     x = запускать
    
        '
      check_question: Строка начинается с буквы `d`. Это файл или папка?
      check_answer: Папка. Буква `d` в начале значит папка, а черточка значит файл.
    worked_example: Первый символ `d` в `drwxr-xr-x` означает каталог, а не право доступа.
    prediction_question: Какие поля появятся у каждой строки после `ls -la`?
    command: "ls -la"
    command_explanation:
      - "-l включает подробный формат."
      - "-a показывает скрытые имена, включая начинающиеся с точки."
      - "Команда читает metadata и не изменяет файлы."
    grader:
      source: transcript
      required_patterns: ["(?:^|\\n)[bcdlps-][rwxStTs-]{9}", "\\s+\\.\\.?\\s*(?:\\r?\\n|$)"]
      forbidden_patterns: ["ls:.*(?:cannot access|No such file)"]
      fact_template: Получен длинный листинг с типом объекта и permissions.
    explanation_prompt: Чем первый символ строки отличается от следующих девяти символов permissions?
    review_question: Что добавляют флаги `-l` и `-a`?

  - id: linux-files-home-hidden
    order: 31
    title: 'Сам: найди скрытые файлы у себя дома'
    summary: В твоей домашней папке есть файлы настроек, имена которых начинаются с точки. Покажи их подробным списком,
      не переходя в эту папку.
    estimated_minutes: 10
    skill_id: linux-files
    stage: independent
    ladder_step: 2
    target_tags: []
    requires_target: false
    term:
      name: скрытый файл
      definition: Файл, имя которого начинается с точки. Обычный список его не показывает.
    simple_theory:
      analogy: Некоторые вещи в комнате лежат в ящике стола. Их не видно, пока не откроешь ящик.
      what_it_does:
      - Имена с точкой в начале обычный список прячет.
      - Нужен ключ, который показывает всё.
      - Папку можно назвать прямо в команде, переходить не нужно.
      words: []
      picture: "обычный список:  (пусто)\nполный список:   .bashrc  .profile  .bash_logout\n                 ^ точка\
        \ в начале = скрытый\n"
      check_question: Почему файл `.bashrc` не виден в обычном списке?
      check_answer: Его имя начинается с точки. Такие файлы список прячет, пока не попросишь всё.
    worked_example: Настройки оболочки хранятся в скрытых файлах домашней папки. Их надо уметь увидеть, не меняя текущий
      каталог.
    prediction_question: Какие строки в конце списка будут начинаться с точки?
    command: ls -la ~
    command_patterns:
    - '(?:^|\s)-[a-zA-Z]*a'
    - '(?:^|\s)-[a-zA-Z]*l'
    - '(?:^|\s)(?:~/?|\$HOME/?|/home/[^\s/]+/?)(?:\s|$)'
    command_tools: [ls]
    accepted_commands:
    - ls -al ~
    - ls -la $HOME
    - ls -al $HOME
    - ls -la ~/
    command_explanation:
    - -l даёт подробную строку на каждый файл.
    - -a показывает и скрытые имена.
    - ~ задаёт домашнюю папку без перехода в неё.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)-[rwx-]{9}[^\n]*\s\.bashrc\s*(?:\r?\n|$)
      - \s\.\.?\s*(?:\r?\n|$)
      forbidden_patterns:
      - ls:.*(?:cannot access|No such file)
      fact_template: Подробный список домашней папки показал скрытый файл `.bashrc`.
    explanation_prompt: Какой ключ показал скрытые файлы и как ты узнал, что это обычные файлы, а не папки?
    review_question: Как показать скрытые файлы папки, не переходя в неё?

  - id: linux-files-skel
    order: 32
    title: 'Перенос: образец домашней папки'
    summary: Новому пользователю домашнюю папку заполняют копией из папки skel внутри etc. Покажи её подробным списком
      со скрытыми файлами.
    estimated_minutes: 10
    skill_id: linux-files
    stage: transfer
    ladder_step: 3
    target_tags: []
    requires_target: false
    term:
      name: образец домашней папки
      definition: Папка `/etc/skel`. Её содержимое копируется в домашнюю папку каждого нового пользователя.
    simple_theory:
      analogy: У школы есть образец тетради. Каждому новому ученику выдают такую же.
      what_it_does:
      - У системы есть папка-образец для новых пользователей.
      - В ней лежат те же скрытые файлы, что у тебя дома.
      - Их хозяин не ты, а главный пользователь системы.
      words: []
      picture: '/etc/skel/.bashrc  --копия-->  /home/student/.bashrc

        хозяин: root                   хозяин: student

        '
      check_question: Чем отличается хозяин файла `.bashrc` в образце и у тебя дома?
      check_answer: В образце хозяин главный пользователь системы, а у тебя дома ты сам.
    worked_example: Сравнение с образцом помогает понять, какие файлы появились у пользователя сами, а какие он добавил
      позже.
    prediction_question: Кто будет хозяином файлов в папке-образце?
    command: ls -la /etc/skel
    command_patterns:
    - '(?:^|\s)-[a-zA-Z]*a'
    - '(?:^|\s)-[a-zA-Z]*l'
    - '(?:^|\s)/etc/skel/?(?:\s|$)'
    command_tools: [ls]
    accepted_commands:
    - ls -al /etc/skel
    - ls -la /etc/skel/
    command_explanation:
    - Тот же подробный список со скрытыми файлами.
    - Путь от корня ведёт в папку-образец.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)-[rwx-]{9}\s+\d+\s+root\s+root\s[^\n]*\s\.profile\s*(?:\r?\n|$)
      forbidden_patterns:
      - ls:.*(?:cannot access|No such file)
      fact_template: Список папки-образца показал скрытые файлы с хозяином root.
    explanation_prompt: Что общего у папки-образца и твоей домашней папки и чем они отличаются?
    review_question: Откуда новый пользователь получает свои первые скрытые файлы?

  - id: linux-change-and-read
    order: 35
    title: Перейти, прочитать и не потерять контекст
    summary: Связываем cd, pwd, cat и less в безопасный маршрут чтения системных файлов.
    estimated_minutes: 25
    skill_id: linux-reading
    stage: guided
    target_tags: []
    requires_target: false
    term:
      name: pager
      definition: Программа постраничного чтения, которая показывает длинный текст без изменения исходного файла.
    simple_theory:
      analogy: Сначала переходишь в другую комнату. Потом проверяешь, что пришёл куда надо. И только потом
        читаешь записки на столе.
      what_it_does:
      - Команда `cd` переводит тебя в другую папку.
      - Команда `pwd` проверяет, что переход получился.
      - Команда `cat` печатает короткий файл целиком. Команда `less` листает длинный файл по страницам.
      words:
      - term: cd
        meaning: Сокращение английских слов «сменить папку».
      - term: cat
        meaning: Команда, которая печатает весь файл на экран.
      - term: less
        meaning: Команда для чтения длинного файла по страницам. Выход по клавише `q`.
      - term: pwd
        meaning: Команда. Говорит, в какой папке ты сейчас.
      picture: '$ cd /etc                 шаг 1: перейти
    
        $ pwd                     шаг 2: проверить
    
        /etc
    
        $ cat hostname            шаг 3: прочитать короткий файл
    
        training-vm
    
        $ less os-release         шаг 4: листать длинный файл
    
        '
      check_question: Какая из этих команд меняет твою папку, а какие только читают?
      check_answer: Папку меняет только `cd`. Команды `pwd`, `cat` и `less` ничего не меняют, они только показывают.
    worked_example: После `cd /etc` команда `pwd` подтверждает каталог, `cat` печатает короткий файл, а `less` подходит для просмотра более длинного.
    prediction_question: Какая команда изменит текущий каталог, а какие только прочитают данные?
    command: "cd /etc && pwd && printf '\nCAT_HOSTNAME\n' && cat hostname && printf '\nLESS_OS_RELEASE\n' && less -FX os-release"
    command_explanation:
