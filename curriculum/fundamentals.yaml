      what_it_does:
      - Одна команда печатает весь файл.
      - Вертикальная черта передаёт этот текст дальше.
      - Фильтр оставляет только строки с нужным словом.
      words: []
      picture: "весь файл --|--> фильтр \"/bin/bash\" --> root:...:/bin/bash\n                                   \
        \     student:...:/bin/bash\n"
      check_question: Что делает вертикальная черта между двумя командами?
      check_answer: Передаёт вывод первой команды на вход второй.
    worked_example: Живые пользователи обычно имеют настоящую оболочку. Служебные записи получают оболочку, которая
