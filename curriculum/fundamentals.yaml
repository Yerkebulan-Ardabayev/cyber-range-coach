      - grep:.*error
      fact_template: Фильтр оставил только учётные записи с оболочкой `/bin/bash`.
    explanation_prompt: Что сделала первая команда, а что сделал фильтр?
    review_question: Как отобрать строки файла по слову, передав файл через вертикальную черту?

  - id: text-pipes-release-files
    order: 42
