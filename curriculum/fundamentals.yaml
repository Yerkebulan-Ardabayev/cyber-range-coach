  - id: text-redirection
    order: 45
    title: Перенаправление без потери исходных данных
    summary: Сравниваем stdout, перезапись через > и добавление через >> на временном файле.
    estimated_minutes: 20
    skill_id: linux-redirection
    stage: guided
    target_tags: []
    requires_target: false
    term:
      name: redirection
      definition: Направление стандартного потока команды в файл или из файла вместо терминала.
    worked_example: Одинарный `>` создаёт или перезаписывает файл, а `>>` добавляет данные в конец.
    prediction_question: Какие две строки останутся после последовательности с > и >>?
    command: 'tmp_file="$(mktemp)" && printf "FIRST\n" > "$tmp_file" && printf "SECOND\n" >> "$tmp_file" && cat "$tmp_file"; rm -f "$tmp_file"'
    command_explanation:
      - "mktemp создаёт уникальный файл в каталоге временных данных."
      - "> записывает первую строку, а >> добавляет вторую."
      - "Последняя команда удаляет только созданный этим упражнением временный файл."
    grader:
      source: transcript
      required_patterns: ["FIRST(?:\\r?\\n)SECOND"]
      forbidden_patterns: ["Permission denied", "No such file", "command not found"]
      fact_template: Временный файл показал различие между перезаписью и добавлением stdout.
    explanation_prompt: Что произошло бы со строкой FIRST, если второй оператор тоже был бы одиночным >?
    review_question: Чем > отличается от >>?

  - id: text-redirection-note
    order: 46
    title: 'Сам: записка из двух строк'
    summary: Создай у себя дома файл crc-note.txt. Первой строкой запиши alpha, стерев старое, второй допиши beta,
      затем прочитай файл.
    estimated_minutes: 10
    skill_id: linux-redirection
    stage: independent
    ladder_step: 2
    target_tags: []
    requires_target: false
    term:
      name: запись в файл
      definition: Отправка текста команды в файл вместо экрана. Один знак `>` стирает старое, два знака `>>` дописывают.
    simple_theory:
      analogy: Один знак как новый лист. Два знака как строчка внизу старого листа.
      what_it_does:
      - Команда `echo` печатает слово.
      - Один знак `>` кладёт слово в файл и стирает старое.
      - Два знака `>>` дописывают слово в конец.
      words: []
      picture: "alpha  >   файл   ->  alpha\nbeta   >>  файл   ->  alpha\n                      beta\n"
      check_question: Ты повторил задание ещё раз. Почему в файле снова только две строки?
      check_answer: Первая запись одним знаком `>` каждый раз стирает старое содержимое.
    worked_example: Отчёт собирают по строке. Первая запись начинает файл заново, остальные дописываются.
    prediction_question: Что покажет чтение файла, если повторить задание дважды?
    command: echo alpha > ~/crc-note.txt && echo beta >> ~/crc-note.txt && cat ~/crc-note.txt
    command_patterns:
    - '(?:^|\s)(?:echo|printf) alpha(?:\\n)? > \S*crc-note\.txt(?:\s|$)'
    - '(?:^|\s)(?:echo|printf) beta(?:\\n)? >> \S*crc-note\.txt(?:\s|$)'
    - '(?:^|\s)cat \S*crc-note\.txt(?:\s|$)'
    command_tools: [echo, printf, cat]
    accepted_commands:
    - echo alpha > ~/crc-note.txt; echo beta >> ~/crc-note.txt; cat ~/crc-note.txt
    command_explanation:
    - Один > начинает файл заново со строки alpha.
    - Два >> дописывают beta.
    - cat показывает результат.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)alpha(?:\r?\n)beta\s*(?:\r?\n|$)
      forbidden_patterns:
      - beta(?:\r?\n)(?:alpha|beta)
      - Permission denied
      - No such file
      fact_template: Файл содержит ровно alpha и beta, перезапись и дописывание различены.
    explanation_prompt: Что случилось бы при повторе, если бы и первая запись была двумя знаками?
    review_question: Какой знак дописывает в конец файла?

