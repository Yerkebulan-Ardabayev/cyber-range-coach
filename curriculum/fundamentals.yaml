    grader:
      source: transcript
      required_patterns: ["/etc/hosts"]
      forbidden_patterns: ["Permission denied", "find:.*error"]
      fact_template: Файл найден внутри ограниченной области `/etc`.
    explanation_prompt: Какой флаг ограничил глубину и почему это важно в рабочей системе?
    review_question: Как задать find явный каталог и максимальную глубину?

  - id: files-find-conf-top
    order: 51
    title: 'Сам: настройки только верхнего этажа'
    summary: В папке etc много файлов с окончанием conf, и во вложенных папках тоже. Найди только те, что лежат прямо
      в etc, не спускаясь глубже.
    estimated_minutes: 10
    skill_id: linux-search
    stage: independent
    ladder_step: 2
    target_tags: []
    requires_target: false
    term:
      name: шаблон имени
      definition: Имя со звёздочкой. Звёздочка заменяет любое количество любых букв.
    simple_theory:
      analogy: Ищешь все синие тетради, но только на верхней полке. Нижние полки не трогаешь.
      what_it_does:
      - Звёздочка в имени значит «любые буквы».
      - Ограничение глубины не пускает поиск вниз.
      - Шаблон берут в кавычки, чтобы звёздочку понял поиск.
      words: []
      picture: '/etc/ld.so.conf              <- верхний этаж, нашли

        /etc/ld.so.conf.d/x.conf     <- ниже, не ищем

        '
      check_question: Что заменяет звёздочка в шаблоне `*.conf`?
      check_answer: Любое начало имени. Главное, чтобы имя кончалось на `.conf`.
    worked_example: Настройки служб часто лежат прямо в `/etc`. Короткий поиск по верхнему этажу даёт ответ без мусора
      из подпапок.
    prediction_question: Почему в ответе не будет адресов с двумя косыми чертами после etc?
    command: find /etc -maxdepth 1 -name '*.conf'
    command_patterns:
    - '(?:^|\s)find /etc/?(?:\s|$)'
    - '(?:^|\s)-maxdepth 1(?:\s|$)'
    - '(?:^|\s)-name \*\.conf(?:\s|$)'
    command_tools: [find]
    accepted_commands:
    - find /etc -maxdepth 1 -name "*.conf"
    - find /etc -maxdepth 1 -name '*.conf' -print
    - find /etc -maxdepth 1 -name "*.conf" -print
    command_explanation:
    - /etc задаёт, где искать.
    - -maxdepth 1 не пускает вниз.
    - -name '*.conf' задаёт шаблон имени.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)/etc/ld\.so\.conf\s*(?:\r?\n|$)
      forbidden_patterns:
      - (?:^|\n)/etc/[^/\s]+/\S+
      - Permission denied
      - find:.*error
      fact_template: Найдены файлы настроек только верхнего этажа `/etc`.
    explanation_prompt: Что появилось бы в ответе без ограничения глубины?
    review_question: Как найти файлы по шаблону, не спускаясь во вложенные папки?

  - id: files-find-home-dotfiles
    order: 52
    title: 'Перенос: только файлы, не папки'
    summary: Найди у себя дома скрытые файлы на верхнем этаже. Скрытые папки в ответ попасть не должны.
    estimated_minutes: 10
    skill_id: linux-search
    stage: transfer
    ladder_step: 3
    target_tags: []
    requires_target: false
    term:
      name: тип объекта
      definition: Что это, файл или папка. Поиск умеет отбирать только нужный тип.
    simple_theory:
      analogy: Ищешь в ящике только тетради, а коробки с тетрадями пропускаешь.
      what_it_does:
      - Скрытыми бывают и файлы, и папки.
      - Поиск умеет отбирать только обычные файлы.
      - Глубина по-прежнему один этаж.
      words: []
      picture: '~/.bashrc     файл   <- берём

        ~/.profile    файл   <- берём

        ~/.cache/     папка  <- пропускаем

        '
      check_question: Почему папка `.cache` не попадёт в ответ, хотя начинается с точки?
      check_answer: Это папка, а мы просим только обычные файлы.
    worked_example: При разборе чужой домашней папки сначала смотрят скрытые файлы настроек. Папки с кешем только
      мешают.
    prediction_question: Какие два имени точно окажутся в ответе?
    command: find ~ -maxdepth 1 -type f -name '.*'
    command_patterns:
    - '(?:^|\s)find (?:~/?|\$HOME/?|/home/[^\s/]+/?)(?:\s|$)'
    - '(?:^|\s)-maxdepth 1(?:\s|$)'
    - '(?:^|\s)-type f(?:\s|$)'
    - '(?:^|\s)-name \.\*(?:\s|$)'
    command_tools: [find]
    accepted_commands:
    - find ~ -maxdepth 1 -type f -name ".*"
    - find $HOME -maxdepth 1 -type f -name '.*'
    - find $HOME -maxdepth 1 -type f -name ".*"
    command_explanation:
    - ~ задаёт домашнюю папку.
    - -type f оставляет только обычные файлы.
    - -name '.*' берёт имена с точкой в начале.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)/home/[^/\s]+/\.bashrc\s*(?:\r?\n|$)
      forbidden_patterns:
      - /\.cache\s*(?:\r?\n|$)
      - (?:^|\n)/home/[^/\s]+/[^\s]+/
      - find:.*error
      fact_template: Найдены только скрытые файлы верхнего этажа домашней папки.
    explanation_prompt: Какой ключ отсёк папки и как ты это проверил по ответу?
    review_question: Как найти только файлы, а не папки?

  - id: linux-permissions-read
    order: 60
    title: Permissions как проверяемая граница
    summary: Читаем права пользователя, группы и остальных без автоматического chmod.
    estimated_minutes: 25
    skill_id: linux-permissions
    stage: independent
    target_tags: []
    requires_target: false
    term:
      name: mode bits
      definition: Набор прав read, write и execute для owner, group и others.
    worked_example: "`-rw-r--r--` разрешает владельцу запись, а группе и остальным только чтение."
    prediction_question: Какая тройка permissions относится к группе?
    command: "stat -c '%A %U %G %n' /etc/hosts"
    command_explanation:
      - "stat читает metadata одного указанного файла."
      - "%A выводит символьные permissions."
      - "%U и %G выводят владельца и группу."
    grader:
      source: transcript
      required_patterns: ["[bcdlps-][rwxStTs-]{9}\\s+\\S+\\s+\\S+\\s+/etc/hosts"]
      forbidden_patterns: ["stat:.*(?:failed|No such file)"]
      fact_template: Получены permissions, owner и group файла `/etc/hosts`.
    explanation_prompt: Какие права относятся к owner, group и others в полученной строке?
    review_question: Почему просмотр permissions безопаснее начинать со stat, а не с chmod?

  - id: linux-permissions-shadow
    order: 61
    title: 'Сам: права на файл паролей'
    summary: В папке etc лежит файл shadow с закрытыми данными паролей. Покажи одной строкой его права, хозяина, группу
      и имя, не открывая сам файл.
    estimated_minutes: 10
    skill_id: linux-permissions
    stage: independent
    ladder_step: 2
    target_tags: []
    requires_target: false
    term:
      name: закрытый файл
      definition: Файл, который обычный пользователь не может читать. Его права и хозяина видно и без чтения.
    simple_theory:
      analogy: Сейф стоит в комнате. Ты видишь, чей он и какой на нём замок, но открыть не можешь.
      what_it_does:
      - Сведения о файле видно, даже если читать его нельзя.
      - Права пишутся тремя тройками букв.
      - Группа тоже может получить доступ.
      words: []
      picture: "-rw-r-----  root  shadow  /etc/shadow\n rw-  хозяин: читать и менять\n    r--  группа shadow: читать\n\
        \       ---  остальные: ничего\n"
      check_question: Может ли обычный ученик прочитать этот файл по таким правам?
      check_answer: Нет. Последняя тройка из черт, остальным нельзя ничего.
    worked_example: Права на файл паролей первыми смотрят при проверке системы. Слишком открытые права это серьёзная
      находка.
    prediction_question: Какой будет последняя тройка прав у файла с паролями?
    command: stat -c '%A %U %G %n' /etc/shadow
    command_patterns:
    - '(?:^|\s)/etc/shadow(?:\s|$)'
    command_tools: [stat]
    accepted_commands:
    - stat -c "%A %U %G %n" /etc/shadow
    command_explanation:
    - stat читает сведения о файле, а не сам файл.
    - '%A права, %U хозяин, %G группа, %n имя.'
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)-rw-r-----\s+root\s+shadow\s+/etc/shadow
      forbidden_patterns:
      - stat:.*(?:failed|No such file)
      fact_template: Получены права, хозяин и группа файла `/etc/shadow`.
    explanation_prompt: Почему права файла видны, хотя читать его нельзя?
    review_question: Как узнать права файла, не открывая его?

  - id: linux-permissions-tmp
    order: 62
    title: 'Перенос: права общей папки'
    summary: Папка tmp от корня общая, туда пишут все. Покажи одной строкой её права, хозяина, группу и имя и найди
      необычную букву.
    estimated_minutes: 10
    skill_id: linux-permissions
    stage: transfer
    ladder_step: 3
    target_tags: []
    requires_target: false
    term:
      name: общая папка
      definition: Папка, куда могут писать все пользователи. Особая буква `t` не даёт удалять чужие файлы.
    simple_theory:
      analogy: Общая полка в классе. Класть может каждый, а забрать чужое нельзя.
      what_it_does:
      - Первая буква `d` значит, что это папка.
      - Писать сюда могут все.
      - Буква `t` в конце защищает чужие файлы от удаления.
      words: []
      picture: 'drwxrwxrwt  root  root  /tmp

        ^ папка            ^ t = чужое не удалить

        '
      check_question: Что было бы без буквы `t` в конце?
      check_answer: Любой мог бы удалить чужой файл в этой папке.
    worked_example: Общие папки часто используют для временных файлов. Защита от удаления чужого здесь обязательна.
    prediction_question: Какой будет первая буква строки прав и почему?
    command: stat -c '%A %U %G %n' /tmp
    command_patterns:
    - '(?:^|\s)/tmp/?(?:\s|$)'
    command_tools: [stat]
    accepted_commands:
    - stat -c "%A %U %G %n" /tmp
    command_explanation:
    - Тот же приём, но цель это папка.
    - Последняя буква прав у общей папки особая.
    grader:
      source: transcript
      required_patterns:
      - (?:^|\n)drwxrwxrwt\s+root\s+root\s+/tmp\s*(?:\r?\n|$)
      forbidden_patterns:
      - stat:.*(?:failed|No such file)
      fact_template: Получены права общей папки `/tmp` с защитой от удаления чужих файлов.
    explanation_prompt: Какая буква отличает эти права от обычной папки и что она защищает?
    review_question: Какая буква в правах общей папки защищает чужие файлы?

  - id: linux-users-groups
    order: 65
    title: Пользователь, primary group и дополнительные группы
    summary: Читаем effective identity до рассуждения о доступе к файлам и процессам.
    estimated_minutes: 20
    skill_id: linux-identity
    stage: independent
    target_tags: []
    requires_target: false
    term:
      name: effective identity
      definition: UID и группы, с которыми текущий процесс проходит проверки доступа Linux.
    worked_example: "`id` показывает uid, primary gid и дополнительные groups, но не доказывает право на конкретный файл без его metadata."
    prediction_question: Какие три набора идентификаторов появятся в выводе id?
    command: 'id; printf "PRIMARY_GROUP="; id -gn; getent group "$(id -gn)"'
    command_explanation:
      - "id показывает uid, gid и список groups текущего student."
