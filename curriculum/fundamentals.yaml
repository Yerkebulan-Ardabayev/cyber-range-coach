      - command not found
      fact_template: Получены номер и группы главного пользователя root.
    explanation_prompt: Почему номер 0 важнее самого имени root?
    review_question: Как узнать номер и группы другого пользователя?

  - id: linux-group-sudo
    order: 67
    title: 'Перенос: кто в группе sudo'
    summary: Теперь спроси не про человека, а про группу. Покажи запись группы sudo и узнай, кто в ней состоит.
    estimated_minutes: 10
    skill_id: linux-identity
    stage: transfer
    ladder_step: 3
    target_tags: []
    requires_target: false
    term:
      name: запись группы
      definition: Строка о группе. Поля через двоеточие, в конце список её участников.
    simple_theory:
      analogy: Можно спросить не «в каких кружках Аня», а «кто ходит в шахматный кружок».
      what_it_does:
      - У каждой группы есть своя строка.
      - Последнее поле это список участников.
      - Участники группы `sudo` могут просить права главного пользователя.
      words: []
      picture: 'sudo:x:27:student

        ^имя  ^номер ^участники

        '
      check_question: В каком поле строки группы стоят её участники?
      check_answer: В последнем, после третьего двоеточия.
    worked_example: Список участников группы sudo показывает, кто может действовать с правами главного пользователя.
    prediction_question: Какой номер у группы sudo в Ubuntu?
    command: getent group sudo
    command_patterns:
    - '(?:^|\s)(?:getent group sudo|\^?sudo: /etc/group)(?:\s|$)'
    command_tools: [getent, grep]
    command_explanation:
    - getent group читает запись одной группы.
    grader:
      source: transcript
      required_patterns:
      - '(?:^|\n)sudo:x:27:'
      forbidden_patterns:
      - command not found
      fact_template: Получена запись группы sudo со списком участников.
    explanation_prompt: Чем вопрос «в каких я группах» отличается от вопроса «кто в этой группе»?
    review_question: Как увидеть участников группы?

  - id: network-ip-route
